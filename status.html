<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช็กสถานะคำขอ - นัดเก็บขยะชิ้นใหญ่และขยะอันตราย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-gray-800 pb-12">

    <header class="bg-gradient-to-r from-emerald-700 via-teal-700 to-emerald-800 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white/15 p-2.5 rounded-2xl backdrop-blur-md border border-white/20 shadow-inner">
                    <span class="text-2xl">🚛</span>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold tracking-tight leading-tight">นัดเก็บขยะชิ้นใหญ่และขยะอันตราย</h1>
                    <p class="text-xs text-emerald-100 font-light opacity-90">เช็กสถานะคำขอของคุณ</p>
                </div>
            </div>
            <a href="index.html" class="bg-white/15 hover:bg-white/25 border border-white/20 text-white text-xs font-semibold px-3 py-2 rounded-full transition whitespace-nowrap">
                ＋ ส่งคำขอใหม่
            </a>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-2xl space-y-5 mt-2">

        <div class="bg-white rounded-2xl shadow-md p-5 border border-slate-200/80">
            <div class="flex items-center space-x-3 mb-4 border-b pb-3 border-gray-100">
                <span class="text-xl">🔍</span>
                <h2 class="text-base font-bold text-gray-800">ค้นหาคำขอของคุณ</h2>
            </div>

            <form onsubmit="checkStatus(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">รหัสคำขอ <span class="text-red-500">*</span></label>
                    <input type="text" id="reqCode" required autocomplete="off" class="w-full p-3 bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none transition uppercase" placeholder="เช่น REQ-261027-1234">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">เบอร์โทรศัพท์ที่ใช้ยื่นคำขอ <span class="text-red-500">*</span></label>
                    <input type="tel" id="reqPhone" required autocomplete="tel" class="w-full p-3 bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none transition" placeholder="08x-xxx-xxxx">
                </div>
                <button type="submit" id="checkBtn" class="w-full bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-700 hover:from-emerald-700 hover:to-teal-800 text-white p-3.5 rounded-xl font-bold shadow-md transition disabled:opacity-60">
                    ตรวจสอบสถานะ
                </button>
            </form>
        </div>

        <div id="resultBox" class="hidden"></div>

    </main>

    <script>
        const SUPABASE_URL = 'https://qygskcsprypamperuors.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5Z3NrY3NwcnlwYW1wZXJ1b3JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzODQ0NTcsImV4cCI6MjEwNzk2MDQ1N30.L2e0FYOwlYSnYMe1dQvjaxQqbXgD0ERY35du_sQihao';

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // เติมรหัสคำขอให้อัตโนมัติถ้าเปิดมาจากหน้าฟอร์มหลังส่งคำขอ (?code=REQ-...)
        const codeFromUrl = new URLSearchParams(window.location.search).get('code');
        if (codeFromUrl) {
            document.getElementById('reqCode').value = codeFromUrl;
            document.getElementById('reqPhone').focus();
        }

        const STATUS_INFO = {
            'รอตรวจ': {
                badge: 'bg-amber-100 text-amber-800',
                icon: '⏳',
                title: 'รอเจ้าหน้าที่ตรวจสอบ',
                msg: 'ระบบได้รับคำขอของคุณแล้ว เจ้าหน้าที่กำลังตรวจสอบ กรุณากลับมาเช็กอีกครั้งภายหลัง'
            },
            'นัดหมายแล้ว': {
                badge: 'bg-blue-100 text-blue-800',
                icon: '📅',
                title: 'อนุมัติและนัดหมายแล้ว',
                msg: 'คำขอของคุณได้รับการอนุมัติ กรุณานำขยะไปวางหรือไปส่งตามวิธีและวันที่นัดหมายด้านล่าง'
            },
            'เก็บแล้ว': {
                badge: 'bg-emerald-100 text-emerald-800',
                icon: '✅',
                title: 'เก็บเรียบร้อยแล้ว',
                msg: 'เจ้าหน้าที่ดำเนินการเก็บขยะตามคำขอนี้เรียบร้อยแล้ว ขอบคุณที่ใช้บริการ'
            },
            'ไม่รับ': {
                badge: 'bg-red-100 text-red-800',
                icon: '❌',
                title: 'ไม่สามารถรับคำขอนี้ได้',
                msg: 'เจ้าหน้าที่ไม่สามารถรับคำขอนี้ได้ กรุณาติดต่อเจ้าหน้าที่เพื่อสอบถามรายละเอียด หรือส่งคำขอใหม่'
            }
        };

        function showMessage(html) {
            const box = document.getElementById('resultBox');
            box.innerHTML = html;
            box.classList.remove('hidden');
        }

        async function checkStatus(e) {
            e.preventDefault();
            const code = document.getElementById('reqCode').value.trim();
            const phone = document.getElementById('reqPhone').value.trim();
            const btn = document.getElementById('checkBtn');

            btn.disabled = true;
            btn.innerText = 'กำลังตรวจสอบ...';
            showMessage('<p class="text-center text-gray-500 py-6">กำลังค้นหา...</p>');

            try {
                const { data, error } = await db.rpc('check_request_status', {
                    p_code: code,
                    p_phone: phone
                });

                if (error) throw error;

                if (!data || data.length === 0) {
                    showMessage(`
                        <div class="bg-white rounded-2xl shadow-md p-5 border border-red-200 text-center">
                            <div class="text-3xl mb-2">🔎</div>
                            <p class="font-bold text-gray-800">ไม่พบคำขอ</p>
                            <p class="text-sm text-gray-500 mt-1">กรุณาตรวจสอบรหัสคำขอและเบอร์โทรศัพท์ให้ตรงกับที่ใช้ตอนยื่นคำขอ</p>
                        </div>`);
                    return;
                }

                const r = data[0];
                const info = STATUS_INFO[r.status] || {
                    badge: 'bg-slate-100 text-slate-700', icon: 'ℹ️',
                    title: r.status || 'ไม่ทราบสถานะ',
                    msg: 'กรุณาติดต่อเจ้าหน้าที่เพื่อสอบถามรายละเอียด'
                };

                showMessage(`
                    <div class="bg-white rounded-2xl shadow-md p-5 border border-slate-200/80 space-y-4">
                        <div class="flex items-start justify-between gap-3">
                            <div>
                                <p class="text-xs text-gray-500">รหัสคำขอ</p>
                                <p class="font-bold text-emerald-800 text-lg">${esc(r.code)}</p>
                            </div>
                            <span class="${info.badge} text-xs px-3 py-1.5 rounded-full font-bold whitespace-nowrap">${info.icon} ${esc(info.title)}</span>
                        </div>
                        <p class="text-sm text-gray-600 bg-slate-50 border border-slate-200 rounded-xl p-3">${esc(info.msg)}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm text-gray-600">
                            <p>📅 <strong>วันนัดหมาย:</strong> ${esc(r.appt_date || '-')}</p>
                            <p>📍 <strong>วิธีทิ้ง:</strong> ${esc(r.method || '-')}</p>
                            <p>📦 <strong>สิ่งของ:</strong> ${esc(r.waste_type || '-')} (${esc(r.qty || 1)} ชิ้น)</p>
                            <p>🏘️ <strong>ชุมชน:</strong> ${esc(r.zone || '-')}</p>
                        </div>
                    </div>`);
            } catch (err) {
                console.error(err);
                showMessage(`
                    <div class="bg-red-50 border border-red-200 rounded-2xl p-4 text-sm text-red-700">
                        เกิดข้อผิดพลาดในการตรวจสอบ กรุณาลองใหม่อีกครั้งภายหลัง
                    </div>`);
            } finally {
                // หน่วงสั้นๆ กันการกดรัว
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = 'ตรวจสอบสถานะ';
                }, 1500);
            }
        }
    </script>
</body>
</html>
