<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นัดเก็บขยะชิ้นใหญ่และขยะอันตราย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-gray-800 pb-12">

    <header class="bg-gradient-to-r from-emerald-700 via-teal-700 to-emerald-800 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white/15 p-2.5 rounded-2xl backdrop-blur-md border border-white/20 shadow-inner">
                    <span class="text-2xl">🚛</span>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold tracking-tight leading-tight">นัดเก็บขยะชิ้นใหญ่และขยะอันตราย</h1>
                    <p class="text-xs text-emerald-100 font-light opacity-90">ระบบบริการประชาชน สำหรับ อปท.</p>
                </div>
            </div>
            <a href="status.html" class="bg-white/15 hover:bg-white/25 border border-white/20 text-white text-xs font-semibold px-3 py-2 rounded-full transition whitespace-nowrap">
                🔍 เช็กสถานะ
            </a>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-2xl space-y-5 mt-2">

        <!-- ขั้นตอนที่ 1 -->
        <div class="bg-white rounded-2xl shadow-md p-5 border border-slate-200/80 transition-all hover:shadow-lg">
            <div class="flex items-center space-x-3 mb-4 border-b pb-3 border-gray-100">
                <span class="flex items-center justify-center w-8 h-8 rounded-full bg-emerald-100 text-emerald-800 font-bold text-sm shadow-sm">1</span>
                <h2 class="text-base font-bold text-gray-800">เลือกวิธีทิ้งและปักหมุดบ้าน</h2>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">วิธีทิ้งขยะ <span class="text-red-500">*</span></label>
                <select id="disposalMethod" class="w-full p-3 bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none transition">
                    <option value="รถไปรับถึงบ้าน">🚛 รถไปรับถึงบ้าน</option>
                    <option value="นำไปทิ้งที่จุดนัด">📍 นำไปทิ้งที่จุดนัด</option>
                </select>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-sm font-semibold text-gray-700">ปักหมุดตำแหน่งของคุณ <span class="text-red-500">*</span></label>
                    <span class="text-xs text-emerald-600 font-medium">ลากหมุดเพื่อปรับตำแหน่งได้</span>
                </div>
                <div id="map" class="w-full h-52 rounded-xl border border-gray-300 shadow-inner z-0"></div>
            </div>
        </div>

        <!-- ขั้นตอนที่ 2 -->
        <div class="bg-white rounded-2xl shadow-md p-5 border border-slate-200/80 transition-all hover:shadow-lg">
            <div class="flex items-center space-x-3 mb-4 border-b pb-3 border-gray-100">
                <span class="flex items-center justify-center w-8 h-8 rounded-full bg-emerald-100 text-emerald-800 font-bold text-sm shadow-sm">2</span>
                <h2 class="text-base font-bold text-gray-800">ข้อมูลผู้ขอและสิ่งของ</h2>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">ชื่อ-นามสกุล <span class="text-red-500">*</span></label>
                    <input type="text" id="citizenName" class="w-full p-3 bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none transition" placeholder="เช่น คุณสมศรี ใจดี">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">เบอร์โทรศัพท์ <span class="text-red-500">*</span></label>
                    <input type="tel" id="phone" class="w-full p-3 bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none transition" placeholder="08x-xxx-xxxx">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">พื้นที่ / ชุมชน <span class="text-red-500">*</span></label>
                    <select name="zone" id="zone" class="w-full p-3 bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none transition">
                        <option value="">-- กรุณาเลือกชุมชน --</option>
                        <option value="ชุมชนหนองหัวฟาน">ชุมชนหนองหัวฟาน</option>
                        <option value="ชุมชนดอนตำแยรวมใจ">ชุมชนดอนตำแยรวมใจ</option>
                        <option value="ชุมชนดอนทะยิง">ชุมชนดอนทะยิง</option>
                        <option value="ชุมชนหนองน้ำรั่วรุ่งเรือง">ชุมชนหนองน้ำรั่วรุ่งเรือง</option>
                        <option value="ชุมชนหินตั้งพัฒนา">ชุมชนหินตั้งพัฒนา</option>
                        <option value="ชุมชนหัวหนองรวมใจ">ชุมชนหัวหนองรวมใจ</option>
                        <option value="ชุมชนดอนม่วงสามัคคี">ชุมชนดอนม่วงสามัคคี</option>
                        <option value="ชุมชนเมืองนาทสามัคคีตะวันออก">ชุมชนเมืองนาทสามัคคีตะวันออก</option>
                        <option value="ชุมชนเมืองนาทสัมพันธ์ตะวันตก">ชุมชนเมืองนาทสัมพันธ์ตะวันตก</option>
                        <option value="ชุมชนบ้านน้อยสามัคคี">ชุมชนบ้านน้อยสามัคคี</option>
                        <option value="ชุมชนตลุงหว้า">ชุมชนตลุงหว้า</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">รายละเอียดที่อยู่ / จุดวางขยะ</label>
                    <textarea id="addressDetail" rows="2" class="w-full p-3 bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none transition" placeholder="บ้านเลขที่ ซอย จุดสังเกต (เช่น หน้าประตูรั้วบ้าน)"></textarea>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">ประเภทสิ่งของ <span class="text-red-500">*</span></label>
                        <select id="waste_type" class="w-full p-3 bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none transition text-sm">
                            <option value="">-- เลือกประเภทสิ่งของ --</option>
                            <option value="เฟอร์นิเจอร์ (โต๊ะ ตู้ เตียง)">🪑 เฟอร์นิเจอร์ (โต๊ะ ตู้ เตียง)</option>
                            <option value="ที่นอน/โซฟา">🛋️ ที่นอน/โซฟา</option>
                            <option value="ใบไม้หรือกิ่งไม้">🍃 ใบไม้หรือกิ่งไม้</option>
                            <option value="เศษวัสดุก่อสร้างปริมาณมาก">🧱 เศษวัสดุก่อสร้างปริมาณมาก</option>
                            <option value="เครื่องใช้ไฟฟ้าขนาดใหญ่ (ทีวี เครื่องซักผ้า ตู้เย็น)">📺 เครื่องใช้ไฟฟ้าขนาดใหญ่</option>
                            <option value="ขยะอันตราย (หลอดไฟ กระป๋อง/ภาชนะปนเปื้อน แบตเตอรี่)">⚠️ ขยะอันตราย</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">จำนวน (ชิ้น)</label>
                        <input type="number" id="quantity" value="1" min="1" class="w-full p-3 bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none transition text-center font-bold">
                    </div>
                </div>
            </div>
        </div>

        <!-- ขั้นตอนที่ 3 -->
        <div class="bg-white rounded-2xl shadow-md p-5 border border-slate-200/80 transition-all hover:shadow-lg">
            <div class="flex items-center space-x-3 mb-4 border-b pb-3 border-gray-100">
                <span class="flex items-center justify-center w-8 h-8 rounded-full bg-emerald-100 text-emerald-800 font-bold text-sm shadow-sm">3</span>
                <h2 class="text-base font-bold text-gray-800">เลือกวันนัดหมายคิว</h2>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">วันที่ต้องการให้นัดเก็บ <span class="text-red-500">*</span></label>
                <input type="date" id="appointmentDate" class="w-full p-3 bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none transition font-medium" required>
            </div>

            <button id="submitBtn" onclick="submitRequest()" class="w-full bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-700 hover:from-emerald-700 hover:to-teal-800 text-white p-4 rounded-xl font-bold shadow-md hover:shadow-lg active:scale-[0.99] transition-all flex items-center justify-center space-x-2 disabled:opacity-60">
                <span>📋</span>
                <span>ส่งคำขอจองคิว</span>
            </button>
        </div>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SUPABASE_URL = 'https://qygskcsprypamperuors.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5Z3NrY3NwcnlwYW1wZXJ1b3JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzODQ0NTcsImV4cCI6MjEwNzk2MDQ1N30.L2e0FYOwlYSnYMe1dQvjaxQqbXgD0ERY35du_sQihao';
        const TABLE_NAME = 'waste_requests';

        // เปลี่ยนชื่อเป็น db เพื่อไม่ให้ชนกับ library (window.supabase)
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // วันที่ขั้นต่ำ = วันนี้ (ตามเวลาเครื่องผู้ใช้ ไม่ใช่ UTC)
        const today = new Date();
        const todayStr = today.getFullYear() + '-' +
            String(today.getMonth() + 1).padStart(2, '0') + '-' +
            String(today.getDate()).padStart(2, '0');
        document.getElementById("appointmentDate").min = todayStr;

        var map = L.map('map').setView([13.7563, 100.5018], 13);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);
        var marker = L.marker([13.7563, 100.5018], { draggable: true }).addTo(map);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function (position) {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;
                map.setView([lat, lng], 16);
                marker.setLatLng([lat, lng]);
            }, function (error) {
                console.log("ไม่สามารถดึงตำแหน่งปัจจุบันได้: ", error.message);
            });
        }

        async function submitRequest() {
            const disposalMethod = document.getElementById('disposalMethod').value;
            const citizenName = document.getElementById('citizenName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const zone = document.getElementById('zone').value;
            const addressDetail = document.getElementById('addressDetail').value.trim();
            const wasteType = document.getElementById('waste_type').value;
            const quantity = parseInt(document.getElementById('quantity').value) || 1;
            const appointmentDate = document.getElementById('appointmentDate').value;

            const currentPos = marker.getLatLng();
            const latLngStr = `${currentPos.lat.toFixed(6)}, ${currentPos.lng.toFixed(6)}`;

            if (!citizenName || !phone || !zone || !wasteType || !appointmentDate) {
                alert("กรุณากรอกข้อมูลที่มีเครื่องหมาย * ให้ครบถ้วน");
                return;
            }

            // รหัสคำขอ: REQ-วันที่-เลขสุ่ม 4 หลัก (ซ้ำยากกว่าเดิม)
            const ymd = todayStr.replace(/-/g, '').slice(2);
            const requestCode = 'REQ-' + ymd + '-' + Math.floor(1000 + Math.random() * 9000);

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;

            try {
                // ชื่อคอลัมน์ต้องตรงกับตารางใน Supabase เป๊ะ
                const { error } = await db
                    .from(TABLE_NAME)
                    .insert([{
                        'รหัสคำขอ': requestCode,
                        'ชื่อผู้ขอ': citizenName,
                        'เบอร์โทรศัพท์': phone,
                        'โซนพื้นที่': zone,
                        'ที่อยู่และจุดวางขยะ': addressDetail,
                        'พิกัดแผนที่': latLngStr,
                        'ประเภทขยะ': wasteType,
                        'จำนวนชิ้น': quantity,
                        'วิธีการส่ง': disposalMethod,
                        'วันนัดหมาย': appointmentDate,
                        'สถานะคำขอ': 'รอตรวจ'
                    }]);

                if (error) throw error;

                alert(`ส่งคำขอสำเร็จ!\nรหัสคำขอของคุณคือ: ${requestCode}\n\nกรุณาจดรหัสนี้ไว้ ใช้เช็กสถานะคำขอได้ที่หน้า "เช็กสถานะ"`);
                window.location.href = 'status.html?code=' + encodeURIComponent(requestCode);
            } catch (err) {
                console.error("Error saving data:", err);
                alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล: " + err.message);
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
