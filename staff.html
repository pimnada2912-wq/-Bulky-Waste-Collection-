<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นัดเก็บขยะชิ้นใหญ่และขยะอันตราย</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }

        /* ใบงานสำหรับพิมพ์ (ซ่อนบนหน้าจอ) */
        #printArea { display: none; }
        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body > *:not(#printArea) { display: none !important; }
            body { background: #fff !important; }
            #printArea { display: block !important; font-family: 'Sarabun', sans-serif; color: #000; }
            #printArea h1 { font-size: 16px; font-weight: 700; margin: 0 0 2px; }
            #printArea .meta { font-size: 11px; margin-bottom: 8px; }
            #printArea table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
            #printArea th, #printArea td { border: 1px solid #444; padding: 4px 5px; vertical-align: top; text-align: left; }
            #printArea th { background: #e5e7eb; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #printArea tr { page-break-inside: avoid; }
            #printArea .nowrap { white-space: nowrap; }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-gray-800 pb-12">

    <header class="bg-gradient-to-r from-emerald-800 via-teal-800 to-emerald-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/15 p-2 rounded-xl backdrop-blur-md">
                    <span class="text-2xl">🚛</span>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold">นัดเก็บขยะชิ้นใหญ่และขยะอันตราย</h1>
                    <p class="text-xs text-emerald-200 opacity-90">ส่วนงานเจ้าหน้าที่จัดการคิวคำขอ</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span class="hidden sm:inline-flex bg-emerald-500/20 text-emerald-100 border border-emerald-400/30 px-3 py-1 rounded-full text-xs font-semibold">
                    👑 แผงควบคุมเจ้าหน้าที่
                </span>
                <span id="userEmail" class="hidden md:inline text-xs text-emerald-100 opacity-90"></span>
                <button id="logoutBtn" onclick="logout()" class="hidden bg-white/15 hover:bg-white/25 border border-white/20 text-white text-xs font-semibold px-3 py-1.5 rounded-full transition">
                    ออกจากระบบ
                </button>
            </div>
        </div>
    </header>

    <!-- หน้าล็อกอินเจ้าหน้าที่ -->
    <section id="loginView" class="hidden max-w-sm mx-auto p-4 mt-12">
        <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200/80">
            <div class="text-center mb-5">
                <div class="text-4xl mb-2">🔐</div>
                <h2 class="text-lg font-bold text-gray-800">เข้าสู่ระบบเจ้าหน้าที่</h2>
                <p class="text-xs text-gray-500 mt-1">เฉพาะเจ้าหน้าที่ที่ได้รับอนุญาตเท่านั้น</p>
            </div>
            <form onsubmit="login(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">อีเมล</label>
                    <input type="email" id="loginEmail" required autocomplete="username" class="w-full p-3 bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none transition" placeholder="staff@example.com">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">รหัสผ่าน</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password" class="w-full p-3 bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none transition" placeholder="••••••••">
                </div>
                <p id="loginError" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl p-2.5"></p>
                <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-700 hover:from-emerald-700 hover:to-teal-800 text-white p-3 rounded-xl font-bold shadow-md transition disabled:opacity-60">
                    เข้าสู่ระบบ
                </button>
            </form>
        </div>
    </section>

    <main id="appMain" class="hidden max-w-5xl mx-auto p-4 space-y-6 mt-2">
        <div>
            <h2 class="text-base font-bold text-gray-800 mb-3 flex items-center space-x-2">
                <span>📊</span>
                <span>ภาพรวมคำขอ</span>
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-center border-l-4 border-l-blue-500">
                    <p class="text-3xl font-bold text-gray-800" id="totalRequests">0</p>
                    <p class="text-xs font-medium text-gray-500 mt-1">คำขอทั้งหมด</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-center border-l-4 border-l-amber-500">
                    <p class="text-3xl font-bold text-amber-600" id="pendingRequests">0</p>
                    <p class="text-xs font-medium text-gray-500 mt-1">รอตรวจ</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-center border-l-4 border-l-emerald-500">
                    <p class="text-3xl font-bold text-emerald-600" id="completedRequests">0</p>
                    <p class="text-xs font-medium text-gray-500 mt-1">เก็บแล้ว/อนุมัติ</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-center border-l-4 border-l-purple-500">
                    <p class="text-3xl font-bold text-purple-600" id="totalWeight">0</p>
                    <p class="text-xs font-medium text-gray-500 mt-1">จำนวนชิ้นรวม</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200/80">
            <div class="flex flex-wrap justify-between items-center gap-2 mb-4 border-b pb-3 border-gray-100">
                <h2 class="text-base font-bold text-gray-800 flex items-center space-x-2">
                    <span>📑</span>
                    <span>รายการคำขอจากประชาชน</span>
                </h2>
                <div class="flex flex-wrap gap-2">
                    <button onclick="exportCSV()" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-3 py-2 rounded-xl transition border border-blue-200">
                        ⬇️ ส่งออก Excel (CSV)
                    </button>
                    <button onclick="printWorksheet()" class="text-xs bg-purple-50 hover:bg-purple-100 text-purple-700 font-semibold px-3 py-2 rounded-xl transition border border-purple-200">
                        🖨️ พิมพ์ใบงาน
                    </button>
                    <button onclick="fetchRequests()" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold px-3 py-2 rounded-xl transition border border-emerald-200">
                        🔄 รีเฟรชข้อมูล
                    </button>
                </div>
            </div>

            <!-- ตัวกรอง -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-3">
                <input type="search" id="searchInput" oninput="applyFilters()" placeholder="🔍 ค้นหาชื่อ / เบอร์ / รหัส / ที่อยู่" class="p-2.5 text-sm bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none">
                <select id="filterStatus" onchange="applyFilters()" class="p-2.5 text-sm bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none">
                    <option value="">ทุกสถานะ</option>
                    <option value="รอตรวจ">⏳ รอตรวจ</option>
                    <option value="นัดหมายแล้ว">📅 นัดหมายแล้ว</option>
                    <option value="เก็บแล้ว">✅ เก็บแล้ว</option>
                    <option value="ไม่รับ">❌ ไม่รับ</option>
                </select>
                <select id="filterZone" onchange="applyFilters()" class="p-2.5 text-sm bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none">
                    <option value="">ทุกชุมชน</option>
                </select>
                <div class="flex gap-2">
                    <input type="date" id="filterDate" onchange="applyFilters()" class="flex-1 min-w-0 p-2.5 text-sm bg-slate-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none">
                    <button onclick="setToday()" class="text-xs bg-slate-100 hover:bg-slate-200 border border-gray-300 rounded-xl px-2.5 font-semibold text-gray-700 whitespace-nowrap">วันนี้</button>
                </div>
            </div>
            <div class="flex justify-between items-center mb-4">
                <p id="resultInfo" class="text-xs text-gray-500"></p>
                <button onclick="clearFilters()" class="text-xs text-gray-500 hover:text-gray-800 underline">ล้างตัวกรอง</button>
            </div>

            <div id="requestListContainer" class="space-y-4">
                <p class="text-center text-gray-500 py-8">กำลังโหลดข้อมูล...</p>
            </div>
        </div>
    </main>

    <!-- ใบงานสำหรับพิมพ์ -->
    <div id="printArea"></div>

    <script>
        // ⚠️ URL ต้องตรงกับ project ref ใน anon key: qygskcsprypamperuors (ไม่มี g เกิน)
        const SUPABASE_URL = 'https://qygskcsprypamperuors.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5Z3NrY3NwcnlwYW1wZXJ1b3JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzODQ0NTcsImV4cCI6MjEwNzk2MDQ1N30.L2e0FYOwlYSnYMe1dQvjaxQqbXgD0ERY35du_sQihao';
        const TABLE_NAME = 'waste_requests';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allData = [];
        let filteredData = [];

        // ---------- ระบบล็อกอิน (Supabase Auth) ----------
        let currentUserId = null;

        function showView(session) {
            const loginView = document.getElementById('loginView');
            const appMain = document.getElementById('appMain');
            const logoutBtn = document.getElementById('logoutBtn');
            const userEmail = document.getElementById('userEmail');

            if (session) {
                loginView.classList.add('hidden');
                appMain.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
                userEmail.innerText = session.user.email || '';
                if (currentUserId !== session.user.id) {
                    currentUserId = session.user.id;
                    fetchRequests();
                }
            } else {
                currentUserId = null;
                allData = [];
                filteredData = [];
                appMain.classList.add('hidden');
                logoutBtn.classList.add('hidden');
                userEmail.innerText = '';
                document.getElementById('requestListContainer').innerHTML = '';
                document.getElementById('printArea').innerHTML = '';
                loginView.classList.remove('hidden');
            }
        }

        async function login(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errBox = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = 'กำลังเข้าสู่ระบบ...';

            const { error } = await _supabase.auth.signInWithPassword({ email, password });

            btn.disabled = false;
            btn.innerText = 'เข้าสู่ระบบ';

            if (error) {
                console.error(error);
                errBox.innerText = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
                errBox.classList.remove('hidden');
                return;
            }
            document.getElementById('loginPassword').value = '';
        }

        async function logout() {
            await _supabase.auth.signOut();
        }

        _supabase.auth.onAuthStateChange((event, session) => {
            showView(session);
        });

        window.onload = async function () {
            const { data: { session } } = await _supabase.auth.getSession();
            showView(session);
        };

        // ---------- เครื่องมือช่วย ----------
        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function fmtDateTime(v) {
            if (!v) return '';
            const d = new Date(v);
            if (isNaN(d)) return '';
            return d.toLocaleString('th-TH', {
                timeZone: 'Asia/Bangkok',
                day: 'numeric', month: 'short', year: '2-digit',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function statusOf(item) {
            return item['สถานะคำขอ'] || 'รอตรวจ';
        }

        // ---------- ดึงข้อมูล ----------
        async function fetchRequests() {
            const container = document.getElementById('requestListContainer');
            container.innerHTML = '<p class="text-center text-gray-500 py-8">กำลังโหลดข้อมูล...</p>';

            try {
                const { data, error } = await _supabase
                    .from(TABLE_NAME)
                    .select('*')
                    .order('ID', { ascending: false });

                if (error) {
                    console.error(error);
                    container.innerHTML = `<div class="p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm"><p class="font-bold">เกิดข้อผิดพลาดในการดึงข้อมูล:</p><p>${esc(error.message)}</p></div>`;
                    return;
                }

                allData = data || [];
                updateDashboardCards(allData);
                rebuildZoneOptions();
                applyFilters();
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p class="text-red-500 text-center py-4">เกิดข้อผิดพลาดในการเชื่อมต่อ: ${esc(err.message)}</p>`;
            }
        }

        function updateDashboardCards(data) {
            document.getElementById('totalRequests').innerText = data.length;
            document.getElementById('pendingRequests').innerText =
                data.filter(i => statusOf(i) === 'รอตรวจ').length;
            document.getElementById('completedRequests').innerText =
                data.filter(i => ['เก็บแล้ว', 'นัดหมายแล้ว'].includes(statusOf(i))).length;
            document.getElementById('totalWeight').innerText =
                data.reduce((sum, i) => sum + (Number(i['จำนวนชิ้น']) || 1), 0);
        }

        function rebuildZoneOptions() {
            const sel = document.getElementById('filterZone');
            const keep = sel.value;
            const zones = [...new Set(allData.map(i => i['โซนพื้นที่']).filter(Boolean))]
                .sort((a, b) => a.localeCompare(b, 'th'));
            sel.innerHTML = '<option value="">ทุกชุมชน</option>' +
                zones.map(z => `<option value="${esc(z)}">${esc(z)}</option>`).join('');
            if (zones.includes(keep)) sel.value = keep;
        }

        // ---------- ค้นหา / กรอง ----------
        function applyFilters() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const qDigits = q.replace(/\D/g, '');
            const st = document.getElementById('filterStatus').value;
            const zone = document.getElementById('filterZone').value;
            const date = document.getElementById('filterDate').value;

            filteredData = allData.filter(i => {
                if (st && statusOf(i) !== st) return false;
                if (zone && i['โซนพื้นที่'] !== zone) return false;
                if (date && i['วันนัดหมาย'] !== date) return false;
                if (q) {
                    const hay = [i['ชื่อผู้ขอ'], i['รหัสคำขอ'], i['เบอร์โทรศัพท์'], i['ที่อยู่และจุดวางขยะ']]
                        .join(' ').toLowerCase();
                    const phoneDigits = String(i['เบอร์โทรศัพท์'] || '').replace(/\D/g, '');
                    const phoneHit = qDigits.length >= 3 && phoneDigits.includes(qDigits);
                    if (!hay.includes(q) && !phoneHit) return false;
                }
                return true;
            });

            document.getElementById('resultInfo').innerText =
                `แสดง ${filteredData.length} จาก ${allData.length} รายการ`;
            renderRequestList(filteredData);
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterZone').value = '';
            document.getElementById('filterDate').value = '';
            applyFilters();
        }

        function setToday() {
            const t = new Date();
            document.getElementById('filterDate').value =
                t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
            applyFilters();
        }

        // ---------- แสดงรายการ ----------
        function renderRequestList(data) {
            const container = document.getElementById('requestListContainer');
            container.innerHTML = '';

            if (allData.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 py-12">ยังไม่มีรายการคำขอส่งเข้ามาในระบบ<br><span class="text-xs">(ถ้ามีข้อมูลในตารางแต่ขึ้นข้อความนี้ แปลว่า RLS ยังไม่มี policy แบบ SELECT)</span></p>';
                return;
            }
            if (data.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 py-12">ไม่พบรายการตามเงื่อนไขที่เลือก</p>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = "border border-slate-200 rounded-xl p-4 bg-slate-50 hover:bg-white transition shadow-sm space-y-2";

                const itemId = item['ID'];
                const reqCode = item['รหัสคำขอ'] || `BK-${itemId}`;
                const name = item['ชื่อผู้ขอ'] || 'ไม่ระบุชื่อ';
                const phone = item['เบอร์โทรศัพท์'] || '-';
                const zone = item['โซนพื้นที่'] || '-';
                const address = item['ที่อยู่และจุดวางขยะ'] || '-';
                const mapPos = item['พิกัดแผนที่'] || '';
                const wasteType = item['ประเภทขยะ'] || '-';
                const qty = item['จำนวนชิ้น'] || 1;
                const appDate = item['วันนัดหมาย'] || '-';
                const method = item['วิธีการส่ง'] || '-';
                const status = statusOf(item);
                const created = fmtDateTime(item['created_at']);

                let statusBadge = '';
                if (status === 'รอตรวจ') {
                    statusBadge = `<span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-bold">⏳ รอตรวจ</span>`;
                } else if (status === 'นัดหมายแล้ว') {
                    statusBadge = `<span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-bold">📅 นัดหมายแล้ว</span>`;
                } else if (status === 'เก็บแล้ว') {
                    statusBadge = `<span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-bold">✅ เก็บเรียบร้อย</span>`;
                } else {
                    statusBadge = `<span class="bg-red-100 text-red-800 text-xs px-2.5 py-1 rounded-full font-bold">❌ ไม่รับ</span>`;
                }

                const mapLink = mapPos
                    ? `<a href="https://www.google.com/maps?q=${encodeURIComponent(mapPos)}" target="_blank" rel="noopener" class="text-emerald-700 underline">เปิดแผนที่</a>`
                    : '';

                card.innerHTML = `
                    <div class="flex justify-between items-center pb-2 border-b border-gray-200">
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-emerald-800 text-sm bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">${esc(reqCode)}</span>
                            <span class="font-semibold text-gray-800 text-base">${esc(name)}</span>
                        </div>
                        ${statusBadge}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm text-gray-600 pt-1">
                        <p>📍 <strong>วิธีทิ้ง/ชุมชน:</strong> ${esc(method)} | ${esc(zone)}</p>
                        <p>📦 <strong>สิ่งของ:</strong> ${esc(wasteType)} (${esc(qty)} ชิ้น)</p>
                        <p>📅 <strong>วันนัดเก็บ:</strong> <span class="font-bold text-gray-800">${esc(appDate)}</span></p>
                        <p>📞 <strong>เบอร์โทร:</strong> <a href="tel:${esc(phone)}" class="text-emerald-700 underline">${esc(phone)}</a></p>
                    </div>

                    <p class="text-xs text-gray-500 bg-white p-2.5 rounded-lg border border-gray-200">
                        🏠 <strong>จุดวางขยะ/ที่อยู่:</strong> ${esc(address)} ${mapLink}
                    </p>
                    ${created ? `<p class="text-xs text-gray-400">🕒 ส่งคำขอเมื่อ ${esc(created)}</p>` : ''}

                    ${status === 'รอตรวจ' ? `
                        <div class="flex gap-2 mt-3 pt-2 border-t border-gray-200">
                            <button onclick="updateStatus(${Number(itemId)}, 'นัดหมายแล้ว')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-sm">
                                ✓ อนุมัตินัดหมาย
                            </button>
                            <button onclick="updateStatus(${Number(itemId)}, 'ไม่รับ')" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs font-bold px-4 py-2 rounded-xl transition">
                                ✕ ไม่รับรายการ
                            </button>
                        </div>
                    ` : status === 'นัดหมายแล้ว' ? `
                        <div class="flex gap-2 mt-3 pt-2 border-t border-gray-200">
                            <button onclick="updateStatus(${Number(itemId)}, 'เก็บแล้ว')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-sm">
                                ✅ เก็บเรียบร้อยแล้ว
                            </button>
                        </div>
                    ` : ''}
                `;
                container.appendChild(card);
            });
        }

        async function updateStatus(id, newStatus) {
            if (!confirm(`คุณต้องการเปลี่ยนสถานะรายการนี้เป็น "${newStatus}" ใช่หรือไม่?`)) return;

            const { data, error } = await _supabase
                .from(TABLE_NAME)
                .update({ 'สถานะคำขอ': newStatus })
                .eq('ID', id)
                .select();

            if (error) {
                alert('เกิดข้อผิดพลาดในการอัปเดต: ' + error.message);
            } else if (!data || data.length === 0) {
                alert('อัปเดตไม่สำเร็จ (0 แถว) น่าจะยังไม่มี RLS policy แบบ UPDATE ในตาราง waste_requests');
            } else {
                fetchRequests();
            }
        }

        // ---------- ส่งออก CSV (เปิดด้วย Excel ได้) ----------
        function csvCell(v) {
            let s = String(v ?? '');
            // กัน CSV injection: ข้อความที่ขึ้นต้นด้วย = + - @ จะถูกมองเป็นสูตรใน Excel
            if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
            return '"' + s.replace(/"/g, '""') + '"';
        }

        // เบอร์โทร: ใส่ ="..." เพื่อให้ Excel ไม่ตัดเลข 0 ข้างหน้าทิ้ง
        function csvPhone(v) {
            const p = String(v ?? '').replace(/[^0-9+\-\s]/g, '');
            return '"=""' + p + '"""';
        }

        function exportCSV() {
            if (filteredData.length === 0) {
                alert('ไม่มีรายการให้ส่งออก');
                return;
            }
            const headers = ['รหัสคำขอ', 'ชื่อผู้ขอ', 'เบอร์โทรศัพท์', 'โซนพื้นที่', 'ที่อยู่และจุดวางขยะ',
                'พิกัดแผนที่', 'ประเภทขยะ', 'จำนวนชิ้น', 'วิธีการส่ง', 'วันนัดหมาย', 'สถานะคำขอ', 'เวลาที่ส่งคำขอ'];

            const rows = filteredData.map(i => [
                csvCell(i['รหัสคำขอ']),
                csvCell(i['ชื่อผู้ขอ']),
                csvPhone(i['เบอร์โทรศัพท์']),
                csvCell(i['โซนพื้นที่']),
                csvCell(i['ที่อยู่และจุดวางขยะ']),
                csvCell(i['พิกัดแผนที่']),
                csvCell(i['ประเภทขยะ']),
                csvCell(i['จำนวนชิ้น']),
                csvCell(i['วิธีการส่ง']),
                csvCell(i['วันนัดหมาย']),
                csvCell(statusOf(i)),
                csvCell(fmtDateTime(i['created_at']))
            ].join(','));

            const csv = '\uFEFF' + headers.map(csvCell).join(',') + '\r\n' + rows.join('\r\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const t = new Date();
            const stamp = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
            const a = document.createElement('a');
            a.href = url;
            a.download = `waste_requests_${stamp}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        // ---------- พิมพ์ใบงานรถเก็บขยะ ----------
        function printWorksheet() {
            if (filteredData.length === 0) {
                alert('ไม่มีรายการให้พิมพ์');
                return;
            }

            // เรียงตามชุมชน แล้วตามลำดับคำขอ เพื่อให้วางแผนเส้นทางง่าย
            const rows = [...filteredData].sort((a, b) =>
                String(a['โซนพื้นที่'] || '').localeCompare(String(b['โซนพื้นที่'] || ''), 'th') ||
                (Number(a['ID']) - Number(b['ID']))
            );

            const st = document.getElementById('filterStatus').value || 'ทุกสถานะ';
            const zone = document.getElementById('filterZone').value || 'ทุกชุมชน';
            const date = document.getElementById('filterDate').value || 'ทุกวัน';
            const printedAt = new Date().toLocaleString('th-TH', { timeZone: 'Asia/Bangkok', dateStyle: 'medium', timeStyle: 'short' });
            const totalQty = rows.reduce((s, i) => s + (Number(i['จำนวนชิ้น']) || 1), 0);

            const body = rows.map((i, idx) => `
                <tr>
                    <td class="nowrap">${idx + 1}</td>
                    <td class="nowrap">${esc(i['รหัสคำขอ'])}</td>
                    <td>${esc(i['ชื่อผู้ขอ'])}</td>
                    <td class="nowrap">${esc(i['เบอร์โทรศัพท์'])}</td>
                    <td>${esc(i['โซนพื้นที่'])}</td>
                    <td>${esc(i['ที่อยู่และจุดวางขยะ'])}</td>
                    <td>${esc(i['ประเภทขยะ'])} (${esc(i['จำนวนชิ้น'] || 1)})</td>
                    <td>${esc(i['วิธีการส่ง'])}</td>
                    <td class="nowrap">${esc(i['วันนัดหมาย'])}</td>
                    <td style="width:70px"></td>
                </tr>`).join('');

            document.getElementById('printArea').innerHTML = `
                <h1>ใบงานเก็บขยะชิ้นใหญ่และขยะอันตราย</h1>
                <div class="meta">
                    สถานะ: ${esc(st)} | ชุมชน: ${esc(zone)} | วันนัดเก็บ: ${esc(date)} |
                    รวม ${rows.length} คำขอ ${totalQty} ชิ้น | พิมพ์เมื่อ ${esc(printedAt)}
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ที่</th><th>รหัส</th><th>ชื่อ</th><th>เบอร์โทร</th><th>ชุมชน</th>
                            <th>ที่อยู่/จุดวางขยะ</th><th>สิ่งของ (ชิ้น)</th><th>วิธีทิ้ง</th><th>วันนัด</th><th>หมายเหตุ/ลงชื่อ</th>
                        </tr>
                    </thead>
                    <tbody>${body}</tbody>
                </table>`;

            window.print();
        }
    </script>
</body>
